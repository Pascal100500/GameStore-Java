<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameStore — Каталог игр</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="site-header">
    <div class="header-content">
        <div>
            <h1>🎮 GameStore</h1>
            <p>Каталог компьютерных игр</p>
        </div>
        <div class="admin-navigation"
             sec:authorize="hasRole('ADMIN')">

            <a th:href="@{/admin/users}"
               class="admin-nav-link">
                Управление пользователями
            </a>

        </div>

        <nav>
            <a th:href="@{/}">Главная</a>
            <a th:href="@{/games}">Игры</a>
        </nav>
    </div>
</header>

<main class="container">

    <div class="catalog-heading">
        <h2>Каталог игр</h2>
        <p>Выберите игру, которая вам понравится</p>
    </div>

    <!-- Если активных игр нет -->
    <div class="empty-catalog"
         th:if="${#lists.isEmpty(games)}">
        <p>В каталоге пока нет игр.</p>
    </div>

    <!-- Сетка карточек -->
    <div class="games-grid"
         th:unless="${#lists.isEmpty(games)}">

        <article class="game-card"
                 th:each="game : ${games}">

            <div class="game-cover">
                <img th:src="${game.coverKey != null
                         and !#strings.isEmpty(game.coverKey)
                         ? '/games/' + game.id + '/cover'
                         : '/images/placeholder.jpg'}"
                     th:alt="|Обложка игры ${game.title}|"
                     loading="lazy">
            </div>

            <div class="game-info">

                <h3 th:text="${game.title}">
                    Название игры
                </h3>

                <a class="game-details-button"
                   th:href="@{/games/{id}(id=${game.id})}">
                    Подробнее
                </a>

                <div class="game-details">

                    <span class="game-price"
                          th:text="|${game.price} ₽|">
                        0 ₽
                    </span>

                    <span class="age-badge"
                          th:text="${game.ageLimit != null
                                  ? game.ageLimit + '+'
                                  : 'Без ограничений'}">
                        12+
                    </span>

                </div>

            </div>

        </article>

    </div>

    <!-- Пагинация каталога -->
    <nav class="pagination"
         aria-label="Навигация по страницам"
         th:if="${totalPages > 1}">

        <!-- Предыдущая страница -->
        <a th:if="${currentPage > 0}"
           th:href="@{/games(page=${currentPage - 1})}"
           class="page-link">
            ← Назад
        </a>

        <!-- Номера страниц -->
        <a th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/games(page=${pageNumber})}"
           th:text="${pageNumber + 1}"
           th:classappend="${pageNumber == currentPage} ? ' active' : ''"
           th:attr="aria-current=${pageNumber == currentPage} ? 'page' : null"
           class="page-link">
        </a>

        <!-- Следующая страница -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/games(page=${currentPage + 1})}"
           class="page-link">
            Далее →
        </a>

    </nav>

</main>

<footer class="site-footer">
    <p>© 2026 GameStore</p>
</footer>

</body>
</html>
