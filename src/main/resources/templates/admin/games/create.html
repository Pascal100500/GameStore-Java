<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameStore — Добавление игры</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>
    <h1>🎮 GameStore</h1>
    <p>Панель администратора</p>

    <nav>
        <a th:href="@{/}">Главная</a>
        <a th:href="@{/games}">Каталог игр</a>
    </nav>
</header>

<main>

    <h2>Добавление новой игры</h2>

    <form method="post" th:action="@{/admin/games/create}" enctype="multipart/form-data">

        <p th:if="${success}"
           th:text="${success}"
           style="color: green;">
        </p>

        <p th:if="${error}"
           th:text="${error}"
           style="color: red;">
        </p>

        <div>
            <label for="title">Название игры:</label>
            <input type="text" id="title"
                   name="title" required maxlength="150">
        </div>

        <div>
            <label for="description">Описание:</label>
            <textarea id="description"
                      name="description"
                      maxlength="2000"></textarea>
        </div>

        <div>
            <label for="price">Цена:</label>
            <input type="number" id="price"
                   name="price" min="0"
                   step="0.01" required>
        </div>

        <div>
            <label for="ageLimit">Возрастное ограничение:</label>
            <input type="number" id="ageLimit"
                   name="ageLimit" min="0">
        </div>

        <div>
            <label for="categoryId">Категория:</label>

            <select id="categoryId"
                    name="categoryId" required>

                <option value="">Выберите категорию</option>

                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>

            </select>
        </div>

        <div>
            <label>
                <input type="checkbox"
                       name="isActive" value="true"
                       checked>
                Игра активна
            </label>
        </div>

        <div>
            <label for="cover">Обложка игры:</label>

            <input type="file"
                   id="cover"
                   name="cover"
                   accept="image/jpeg,image/png,image/webp">

            <small>
                Допустимые форматы: JPEG, PNG, WebP.
                Максимальный размер: 5 МБ.
            </small>
        </div>

        <button type="submit">Добавить игру</button>

    </form>

</main>

<footer>
    <p>&copy; 2026 GameStore</p>
</footer>

</body>
</html>
