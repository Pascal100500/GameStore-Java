
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: gamestore-oracle

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8

    ports:
      - "1521:1521"

    volumes:
      - gamestore_oracle_data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

    restart: "no"

volumes:
  gamestore_oracle_data: