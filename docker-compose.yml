services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: gamestore-oracle

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}

    ports:
      - "1521:1521"

    volumes:
      - gamestore_oracle_data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

    restart: "no"

  minio:
    image: elestio/minio:latest
    container_name: gamestore-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - gamestore_minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

    restart: "no"

volumes:
  gamestore_oracle_data:
  gamestore_minio_data: